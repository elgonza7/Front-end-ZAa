<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FCEABB" />
            <stop offset="40%" stop-color="#F8B500" />
            <stop offset="100%" stop-color="#B67B03" />
        </linearGradient>
    </defs>
    
    <!-- Anillos exteriores (Estilo Sello) -->
    <circle cx="250" cy="250" r="235" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <circle cx="250" cy="250" r="222" fill="none" stroke="url(#gold)" stroke-width="2"/>
    
    <!-- Letra A central (Dorada y robusta) -->
    <path d="M 225 120 L 275 120 L 355 340 L 290 340 L 250 215 L 210 340 L 145 340 Z" fill="url(#gold)"/>
    
    <!-- Letra Z izquierda (Blanca y afilada) -->
    <path d="M 90 165 L 205 165 L 95 340 L 240 340" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Ondas transversales (Doradas, simulando la firma/trazo) -->
    <!-- Onda principal gruesa -->
    <path d="M 130 280 C 190 230, 240 290, 330 220" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
    <!-- Onda secundaria fina para dar efecto de elegancia -->
    <path d="M 125 300 C 185 250, 245 310, 335 240" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>

    <!-- Letra a derecha (Blanca) -->
    <!-- Ajustada para que ancle perfectamente en la parte derecha -->
    <text x="345" y="345" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="160" fill="#FFFFFF">a</text>
</svg>